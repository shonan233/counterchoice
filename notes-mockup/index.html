<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes Editor Mockup</title>
</head>
<body>
<!-- Note: make sure to set size in CSS, width/height will be kept up to date by the Notes class. -->
<canvas class="Notes" style="width:calc( min( 100%, 133vh) ); height:auto; aspect-ratio: 3 / 2;"></canvas>
<script type="module">
	import Notes from './Notes.mjs';
	for (const elt of document.getElementsByClassName('Notes')) {
		elt.Notes = new Notes(elt);
	}
</script>
</body>
</html>
